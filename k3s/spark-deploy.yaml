apiVersion: v1
kind: Namespace
metadata:
  name: bigdata
---
# 1. SERVICE
apiVersion: v1
kind: Service
metadata:
  name: spark-master-svc
  namespace: bigdata
spec:
  selector:
    app: spark-master
  type: NodePort
  ports:
    - name: master-rpc
      port: 7077
      targetPort: 7077
    - name: web-ui
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
# 2. SPARK MASTER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      nodeSelector:
        kubernetes.io/hostname: mintdata2-virtualbox
      containers:
        - name: spark-master
          image: apache/spark:3.5.0
          command:
            [
              "/opt/spark/bin/spark-class",
              "org.apache.spark.deploy.master.Master",
            ]
          ports:
            - containerPort: 7077
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1000Mi"
              cpu: "500m" # Giảm xuống 0.5 Core vì Master không cần nhiều CPU
          env:
            - name: SPARK_DAEMON_MEMORY
              value: "800m"

---
# 3. SPARK WORKER (OPTIMIZED)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: mintdata2-virtualbox

      # Cấu hình ổ đĩa để tránh crash container khi tràn bộ nhớ đệm
      volumes:
        - name: spark-worker-data
          hostPath:
            # Tạo thư mục này trên máy ảo: mkdir -p /data/spark-worker
            path: /tmp/spark-worker-data
            type: DirectoryOrCreate

      containers:
        - name: spark-worker
          image: apache/spark:3.5.0
          command:
            [
              "/opt/spark/bin/spark-class",
              "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master-svc:7077",
            ]

          # Mount volume vào container
          volumeMounts:
            - name: spark-worker-data
              mountPath: /opt/spark/work # Nơi lưu log và data tạm của Executor

          # Tối ưu Resource cho máy 8GB RAM (6GB Available)
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4000Mi"
              cpu: "2500m"

          env:
            # Tăng bộ nhớ Heap cho Executor lên 3GB
            - name: SPARK_WORKER_MEMORY
              value: "3000m"
            - name: SPARK_WORKER_CORES
              value: "2"
